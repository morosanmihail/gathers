name: Rust

on:
  push:
    branches: ["main"]
    paths:
      - "models/**"
      - "retrieval/**"
      - "gathers/**"
      - "server/**"
      - "persistence/**"
      - "benches/**"
      - "e2e/**"
      - "mirror/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "models/**"
      - "retrieval/**"
      - "gathers/**"
      - "server/**"
      - "persistence/**"
      - "benches/**"
      - "e2e/**"
      - "mirror/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
