name: Docker Image CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mirror: ${{ steps.filter.outputs.mirror }}
      webui2: ${{ steps.filter.outputs.webui2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - "models/**"
              - "retrieval/**"
              - "gathers/**"
              - "server/**"
              - "persistence/**"
              - "mirror/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Dockerfile"
            mirror:
              - "models/**"
              - "retrieval/**"
              - "gathers/**"
              - "server/**"
              - "persistence/**"
              - "mirror/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Dockerfile.mirror"
            webui2:
              - "webui2/**"

  build-and-push:
    needs: changes
    # A version tag is an explicit release: build and push every image
    # regardless of what changed, so all images carry the new version tag.
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.mirror == 'true' || needs.changes.outputs.webui2 == 'true' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            enabled: ${{ needs.changes.outputs.api == 'true' || github.ref_type == 'tag' }}
            context: .
            file: ./Dockerfile
            image: gathers-api
          - name: mirror
            enabled: ${{ needs.changes.outputs.mirror == 'true' || github.ref_type == 'tag' }}
            context: .
            file: ./Dockerfile.mirror
            image: gathers-mirror
          - name: webui2
            enabled: ${{ needs.changes.outputs.webui2 == 'true' || github.ref_type == 'tag' }}
            context: ./webui2
            file: ./webui2/Dockerfile
            image: gathers-webui2

    steps:
      - name: Skip unchanged image
        if: matrix.enabled != 'true'
        run: echo "No changes for ${{ matrix.name }}, skipping" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: matrix.enabled == 'true'
        with:
          # Full history + tags so `git describe` can name the version.
          fetch-depth: 0

      - name: Compute version
        if: matrix.enabled == 'true'
        id: version
        shell: bash
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: matrix.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: matrix.enabled == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        if: matrix.enabled == 'true'
        id: tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/morosanmihail/${{ matrix.image }}:latest"
            echo "ghcr.io/morosanmihail/${{ matrix.image }}:sha-${{ github.sha }}"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "ghcr.io/morosanmihail/${{ matrix.image }}:${{ github.ref_name }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }} image
        if: matrix.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          build-args: |
            GATHERS_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
